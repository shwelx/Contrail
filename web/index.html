<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://unpkg.com https://esm.sh;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;
    font-src https://fonts.gstatic.com;
    img-src 'self' data: blob:;
    connect-src 'self' https://agkrfxqdfviztqulrsnt.supabase.co wss://agkrfxqdfviztqulrsnt.supabase.co https://tiles.openfreemap.org https://s3.amazonaws.com https://photon.komoot.io https://cdn.jsdelivr.net;
    worker-src blob:;
    child-src blob:;
    object-src 'none';
    base-uri 'none';
    form-action 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Contrail · Live flights</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233B9EFF' d='M12 2c.8 0 1.5.7 1.5 1.5V9l7.5 4.5V16l-7.5-2.2V19l2 1.5V22L12 21l-3.5 1v-1.5l2-1.5v-5.2L3 16v-2.5L10.5 9V3.5C10.5 2.7 11.2 2 12 2z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
    integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="map" role="application" aria-label="Map of aircraft"></div>

  <aside class="panel" id="panel">
    <button class="grab" id="grab" aria-label="Show or hide the panel"><i></i></button>
    <header class="head">
      <div class="brand">
        <h1>Contrail</h1>
        <div class="units" id="units" role="group" aria-label="Altitude units">
          <span class="units-thumb" aria-hidden="true"></span>
          <button type="button" data-u="ft">ft</button>
          <button type="button" data-u="km">km</button>
        </div>
        <button class="collapse" id="collapse" aria-label="Hide the panel" aria-expanded="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      </div>
      <div class="live" id="live"><span id="live-text">Loading…</span></div>
      <p class="tagline" id="tagline">Planes over New York right now, updated every minute.</p>
      <div class="stats">
        <div class="stat"><b class="num" id="stat-air">–</b><span>Flying</span></div>
        <div class="stat"><b class="num" id="stat-ground">–</b><span>Landed</span></div>
        <div class="stat watch"><b class="num" id="stat-watched">–</b><span>On your list</span></div>
      </div>
    </header>

    <div class="scroll">

      <section class="detail" id="detail" hidden aria-live="polite"></section>

      <nav class="tabs" role="tablist" id="tabs">
        <span class="tab-ink" id="tab-ink" aria-hidden="true"></span>
        <button class="tab" role="tab" id="tab-flights" aria-controls="panel-flights" aria-selected="true">Flights<span class="count num" id="flights-count"></span></button>
        <button class="tab" role="tab" id="tab-watch" aria-controls="panel-watch" aria-selected="false">Watchlist</button>
        <button class="tab" role="tab" id="tab-near" aria-controls="panel-near" aria-selected="false">Near me</button>
      </nav>

      <div class="body">
        <div role="tabpanel" id="panel-flights" aria-labelledby="tab-flights">
          <div class="search">
            <label class="sr-only" for="q">Search flights</label>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="input" id="q" type="search" placeholder="Search by flight, airline, plane or country" autocomplete="off" />
          </div>
          <ul class="list" id="flights"></ul>
        </div>

        <div role="tabpanel" id="panel-watch" aria-labelledby="tab-watch" hidden></div>

        <div role="tabpanel" id="panel-near" aria-labelledby="tab-near" hidden>
          <p class="help">See which planes are closest to you right now.</p>
          <label class="field" for="radius">How far to look</label>
          <div class="range-row">
            <input id="radius" type="range" min="10" max="400" step="10" value="150" />
            <output id="radius-out" for="radius" class="num">150 km</output>
          </div>
          <button class="btn block" id="near-btn">Use my location</button>
          <h2 id="near-title" hidden>Closest first</h2>
          <ul class="list" id="near-list"></ul>
        </div>
      </div>
    </div>

    <footer class="foot" id="foot"></footer>
  </aside>

  <div class="cities" id="cities">
    <label class="sr-only" for="city">Go to a city</label>
    <div class="search-shell">
      <svg class="s-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="city" type="search" placeholder="Fly to any city" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="city-results" />
      <button type="button" class="s-clear" id="city-clear" aria-label="Clear" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <kbd class="s-key" id="city-key" title="Press / to search">/</kbd>
    </div>
    <div class="city-pop" id="city-pop" hidden>
      <div class="pop-label" id="city-label">Popular</div>
      <div class="city-chips" id="city-chips"></div>
      <ul id="city-results" role="listbox"></ul>
    </div>
  </div>

  <div class="legend" aria-hidden="true" id="legend"></div>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
    integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
